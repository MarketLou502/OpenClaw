language: "en"
expansion_rules:
  # Referenced inside a permutation (see list_anchor usage below) so the list
  # name and this anchor word can appear in either order — "delete my Reading
  # list" and "delete my list Reading" both need to reach the same slot.
  list_anchor: "(board|list)"
intents:
  AddToBoard:
    data:
      - sentences:
          - "(add|put) {item} (to|on) [my|the] {board} [board|list]"

  ListBoard:
    data:
      - sentences:
          - "(show [me]|tell me|what's on|what is on|list|read) [my|the] {board} [board|list]"
          - "[is there|do i have] anything on [my|the] {board} [board|list]"
          - "what [items|tasks] (are|do i have) on [my|the] {board} [board|list]"
          - "what is [in|on] [my|the] {board} [board|list]"
          - "read [me] [the] (items|tasks|contents) (from|on|in) [my|the] {board} [board|list]"

  CompleteItem:
    data:
      - sentences:
          - "(mark|check) {item} (done|off|complete) [(on|from|in) [my|the] {board} [board|list]]"

  RemoveFromBoard:
    data:
      - sentences:
          - "(remove|delete) {item} from [my|the] {board} [board|list]"

  CompleteAnyFree:
    data:
      - sentences:
          - "i [just] (did|finished|completed) {item}"
          - "i'm done with {item}"

  CompleteHabit:
    data:
      - sentences:
          - "(mark|check) {item} (done|off|complete) [for today] (on|from|in) [my|the] [daily] (goals|habits)"

  # NOTE: {list}'s trailing "board"/"list" word is mandatory — (board|list),
  # not [board|list] — in every sentence below. {board} above is a closed set
  # (grocery only), so an optional trailing word was always safe there: the
  # slot itself couldn't match arbitrary text. {list} is a wildcard, so
  # without a required trailing anchor it will swallow an entire unrelated
  # sentence (confirmed: "what is the capital of Australia" matched ShowList
  # with list="the capital of Australia" during testing). The anchor is what
  # keeps these sentences from intercepting general conversation.
  #
  # {list} and <list_anchor> can appear in either order: "delete my Reading
  # list" and "delete my list Reading" both need to reach the same slot.
  # Real reported failure: Aaron said "Delete my list ZZPhase2Test" and the
  # old fixed-order grammar never matched it
  # (see project-jarvis-delete-list-routing-bug-2026-08-02).
  #
  # Written as an explicit alternation — ({list} <list_anchor>|<list_anchor>
  # [of|for] {list}) — rather than hassil's own permutation syntax
  # (`({list};<list_anchor>)`, which only ever inserts a single bare space
  # between the two items) so the anchor-first branch can optionally absorb a
  # connecting "of"/"for". Without that, anchor-first phrasing like "the list
  # *of* Songs I Want to Learn" left the stray "of" glued onto the front of
  # the {list} capture ("of Songs I Want to Learn"), which then matched no
  # real list downstream in dashboard-workflow.js and failed with "No open
  # goal list found matching 'of Songs I Want to Learn'" — misread as a
  # handoff to the `goals` agent, but actually just this grammar gap (see
  # project-songs-list-goal-list-mismatch-2026-08-02). The name-first branch
  # never had this problem (nothing sits between the name and the trailing
  # anchor in natural phrasing), so it keeps the plain two-item shape.
  AddListItem:
    data:
      - sentences:
          - "(add|put) {item} (to|on) [my|the] ({list} <list_anchor>|<list_anchor> [of|for] {list})"

  CompleteListItem:
    data:
      - sentences:
          - "(mark|check) {item} (done|off|complete) (on|from|in) [my|the] ({list} <list_anchor>|<list_anchor> [of|for] {list})"

lists:
  # Work/Personal/Market Lou are deliberately NOT in this closed set anymore —
  # they're resolved uniformly with custom lists via dashboard-workflow.js's
  # resolveListTarget (see AddListItem/CompleteListItem below), so a
  # single grammar family covers both instead of forking between a fixed-board
  # sentence and a custom-list sentence that could silently fail to agree on
  # rigid phrasings. Grocery stays fixed here: it's a distinct agent (Meal
  # Planner) with its own recipe/meal-plan data, not part of this unification.
  board:
    values:
      - "grocery"
      - "groceries"
  item:
    wildcard: true
  list:
    wildcard: true
